<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ทดสอบกล้อง</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    #reader { width: 100%; max-width: 400px; margin: auto; }
  </style>
</head>
<body>
  <h2>📷 ทดสอบการเปิดกล้อง</h2>
  <div id="reader"></div>
  <script>
    Html5Qrcode.getCameras().then(devices => {
      if (devices && devices.length) {
        const scanner = new Html5Qrcode("reader");
        scanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: 250 },
          msg => {
            alert("✅ สแกนสำเร็จ: " + msg);
            scanner.stop();
          },
          err => {
            console.warn("❌ Scan error:", err);
          }
        );
      } else {
        alert("❌ ไม่พบกล้องบนอุปกรณ์นี้");
      }
    }).catch(err => {
      console.error("❌ ไม่สามารถเข้าถึงกล้อง:", err);
      alert("⚠️ ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตการเข้าถึงกล้อง หรือเปิดผ่าน Chrome");
    });
  </script>
</body>
</html>
